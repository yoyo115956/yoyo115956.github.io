# Site settings
title: LiYongTing Blog
SEOTitle: 李泳霆的博客 | LiYongTing Blog
header-img: img/home-bg.jpg
email: 1159561962@qq.com
description: "这里是 @李泳霆 的个人博客，与你一起发现更大的世界 | 要做一个有 swag 的程序员"
keyword: "李泳霆, LiYongTing, yoyo115956, 李泳霆的博客, LiYongTing Blog, 博客, 个人网站, 芯片验证, UVM, SystemVerilog, RISC-V, gem5, 计算机体系结构, 深度学习, 容错设计, 清华大学, 海光信息"
url: "" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'

words_per_minute         : 450


# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
github_username: yoyo115956
#weibo_username:    your-weibo
#zhihu_username:    your-zhihu
#twitter_username:  your-twitter
#linkedin_username: your-linkedin

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN

# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Disqus settings
# disqus_username: your-disqus  # 如需评论系统，填写你的 Disqus 用户名

# Netease settings
netease_comment: false

# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics
# ga_track_id: "G-XXXXXXXXXX" # 填写你自己的 GA4 测量 ID
# ga_domain: yoyo115956.github.io

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "清华大学 计算机体系结构 | 芯片验证工程师 @ 海光信息"
sidebar-avatar: https://github.com/yoyo115956.png # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 1 # A tag will be featured if the size of it is more than this condition value

# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true

# MathJax rendering for layout:page (e.g. post preview)
page-mathjax: false

# Friends（填写你自己的友链）
friends: []
